<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>笔记</title>
<!--
  小应用：笔记（日记 / 随手记）。

  形态对着常见的本地日记应用：最左边一条**图标窄栏**（日记 / 日历 / 标签 / 设置），
  中间是内容区 —— 日记是瀑布流卡片 + 顶部分类页签 + 右下浮动「＋」，日历带年月下拉与
  彩色圆点，设置是仪表盘；点开一条笔记**就在这块正文区里编辑**（不是弹窗抽屉），
  顶部标题、底部一条格式工具栏、右上角 ✓ 保存并返回。

  **正文是 Markdown**：编辑框里存的就是 markdown 源码，工具栏按钮在光标处插入语法，
  另有 编辑 / 分栏 / 预览 三档；列表卡片上的摘要是把 markdown 语法剥掉之后的纯文本。
  渲染器是本页自带的一小段（见 mdToHtml）—— 小应用不参与前端构建、也引不进第三方库，
  而正文是用户输入，**先整段转义再套标记**、链接只放行 http(s)：这是这一页唯一需要
  自己把关的安全点。

  数据落点仍是宿主：正文进主库、附件进数据目录（`omni.notes.*`），因为沙箱 iframe 里
  没有 localStorage。图片在正文里就是一条 `![](媒体地址)`，同时登记在笔记的附件列表里
  —— 保存时正文里已经删掉的那些，会连同文件一起被主进程回收。

  宿主注入：基础样式、window.omni 运行时、window.__OMNI_BOOT__。
-->
<style>
  /* 这一页是"窄栏 + 内容区"的应用壳，不是其它小应用的居中单列 */
  body { overflow: hidden; }
  .app { display: flex; height: 100vh; }

  /* 图标窄栏 */
  .rail {
    flex: 0 0 74px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 12px 6px; border-right: 1px solid var(--line); background: var(--card);
  }
  .rail .mark {
    width: 26px; height: 26px; border-radius: 8px; margin-bottom: 10px;
    background: linear-gradient(135deg, #fb7185, #a78bfa);
  }
  .rail button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    width: 100%; padding: 9px 2px 7px; border-radius: 11px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit;
  }
  .rail button:hover { background: var(--soft); color: var(--fg); }
  .rail button[aria-current="true"] { background: var(--soft); color: var(--fg); }
  .rail button[aria-current="true"] svg { color: var(--accent); }
  .rail .cap { font-size: 10.5px; line-height: 1; }
  .rail .spacer { flex: 1; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; }

  /* 顶栏 */
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 18px 8px; }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .bar .sub { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .bar .act { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .iconbtn {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 28px; height: 28px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { background: var(--soft); color: var(--fg); }
  .iconbtn.primary { color: var(--accent); }
  .search { width: 168px; height: 28px; padding: 4px 10px; font-size: 12px; border-radius: 8px; }

  /* 分类页签（全部 + 标签） */
  .tabs { display: flex; align-items: center; gap: 4px; padding: 0 18px 10px; overflow-x: auto; }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit;
    font-size: 12px; padding: 5px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { background: var(--soft); color: var(--fg); }
  .tab[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }

  .scroll { flex: 1; min-height: 0; overflow: auto; padding: 2px 18px 40px; }

  /* 瀑布流：多列 + 卡片不跨列断开，跟参考图一样的错落卡片墙 */
  .masonry { columns: 3 220px; column-gap: 12px; }
  .grid.list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    break-inside: avoid; display: block; width: 100%; text-align: left;
    appearance: none; font: inherit; color: inherit; cursor: pointer; margin: 0 0 12px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px;
    transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 22px -18px var(--accent); }
  .grid.list .card { margin: 0; display: flex; gap: 12px; align-items: flex-start; }
  .grid.list .card .cmain { flex: 1; min-width: 0; }
  .grid.list .card img { width: 88px; height: 88px; object-fit: cover; margin: 0; flex: 0 0 auto; order: 2; }
  .card img { width: 100%; display: block; border-radius: 10px; margin-bottom: 9px; background: var(--soft); }
  .card h3 { margin: 0 0 4px; font-size: 13.5px; font-weight: 620; line-height: 1.45; word-break: break-word; }
  .card p { margin: 0; font-size: 12px; line-height: 1.75; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
  .card .tag { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 999px; padding: 1px 6px; }
  .card .pin { color: var(--accent); }

  .fab {
    position: absolute; right: 22px; bottom: 22px; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-size: 22px; line-height: 1;
    box-shadow: 0 10px 24px -12px var(--accent); display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .fab:hover { opacity: .92; }

  /* 空态 */
  .empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 60px 0; text-align: center; color: var(--muted); }
  .empty .big { color: var(--line); }
  .empty b { color: var(--fg); font-weight: 600; font-size: 13px; }
  .empty p { margin: 0; font-size: 12px; }

  /* 正文窗口（编辑器） */
  .editor { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ed-hd { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
  .ed-hd .who { font-size: 11.5px; color: var(--muted); }
  .ed-hd .grow { flex: 1; }
  .ed-meta { display: flex; align-items: center; gap: 8px; padding: 8px 18px 0; flex-wrap: wrap; }
  .ed-meta input[type="date"] { width: auto; font-size: 12px; padding: 5px 8px; border-radius: 8px; }
  .ed-meta .tags { flex: 1; min-width: 130px; font-size: 12px; padding: 5px 9px; border-radius: 8px; }
  .ed-meta label { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .ed-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  .ed-body.split .pane { flex: 1 1 50%; }
  .ed-body.split .pane-preview { border-left: 1px solid var(--line); }
  .pane { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; }
  .ed-title {
    border: 0; outline: none; background: transparent; color: inherit; width: 100%;
    font-size: 20px; font-weight: 650; padding: 14px 18px 4px; font-family: inherit;
  }
  .ed-text {
    flex: 1; border: 0; outline: none; background: transparent; color: inherit; resize: none;
    width: 100%; padding: 6px 18px 18px; font: 13px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .ed-preview { padding: 14px 18px 24px; font-size: 13px; }
  .ed-body.preview .pane-input { display: none; }
  .ed-body.preview .pane-preview { border-left: 0; }
  #edErr { padding: 6px 18px; }

  /* 底部格式工具栏（参考图里就是钉在正文下面的一条） */
  .tools {
    display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
    padding: 7px 12px; border-top: 1px solid var(--line); background: var(--card);
  }
  .tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
  .tools .grow { flex: 1; }
  .tools .ai-ico { color: var(--muted); display: inline-flex; align-items: center; padding: 0 4px; }
  .tbtn {
    appearance: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    min-width: 28px; height: 28px; padding: 0 7px; border-radius: 8px; font: inherit; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tbtn:hover:not(:disabled) { background: var(--soft); color: var(--fg); }
  .tbtn:disabled { cursor: not-allowed; }
  .tbtn b { font-weight: 750; }
  .tbtn i { font-style: italic; font-family: Georgia, serif; }
  .tbtn s { text-decoration: line-through; }
  .tbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .count { font-size: 11px; color: var(--muted); }

  /* Markdown 渲染出来的排版（预览与正文共用） */
  .md { font-size: 13px; line-height: 1.85; word-break: break-word; }
  .md h1, .md h2, .md h3 { margin: 14px 0 6px; line-height: 1.4; }
  .md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 13.5px; }
  .md > :first-child { margin-top: 0; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md code { background: var(--soft); border-radius: 5px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .md pre { background: var(--soft); border-radius: 10px; padding: 10px 12px; overflow: auto; }
  .md pre code { background: transparent; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md a { color: var(--accent); }
  .md img { max-width: 100%; border-radius: 10px; display: block; margin: 8px 0; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md input[type="checkbox"] { margin-right: 5px; }

  /* 日历 */
  .calhd { display: flex; align-items: center; gap: 8px; }
  .calhd select {
    appearance: none; border: 1px solid var(--line); background: var(--bg); color: inherit;
    font: inherit; font-size: 13px; font-weight: 600; border-radius: 9px; padding: 5px 26px 5px 10px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .calhd .today { margin-left: auto; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
  .week div { font-size: 11px; color: var(--muted); text-align: center; padding: 4px 0; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; justify-items: center; }
  /* 固定正方形：用 aspect-ratio + 最大高度会被宽列拉成椭圆（第一版就是这么错的） */
  .day {
    appearance: none; border: 1px solid transparent; background: transparent; color: inherit; font: inherit;
    cursor: pointer; border-radius: 50%; width: 36px; height: 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 12.5px; line-height: 15px; white-space: nowrap; overflow: hidden;
  }
  /* 格子只有 36px 高：数字与圆点都别参与收缩，否则两位数会被折成两行 */
  .day > * { flex: 0 0 auto; }
  .day:hover { background: var(--soft); }
  .day.out { color: var(--muted); opacity: .45; }
  .day.has { font-weight: 600; }
  .day.sel { background: var(--fg); color: var(--bg); }
  .day.today:not(.sel) { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .day .dots { display: flex; gap: 2px; height: 5px; align-items: center; }
  .day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .day.sel .dot { background: var(--bg); }
  .day .many { font-size: 9px; line-height: 5px; }

  /* 日历下方的当月条目 */
  .entries { margin-top: 18px; display: flex; flex-direction: column; }
  .entry { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .entry:hover .et { color: var(--accent); }
  .entry .emain { flex: 1; min-width: 0; }
  .entry .etime { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .entry .et { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .entry .ex { font-size: 12px; color: var(--muted); line-height: 1.7; white-space: pre-wrap; }
  .entry img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; background: var(--soft); flex: 0 0 auto; }

  /* 标签云 */
  .tagcloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tagchip {
    appearance: none; font: inherit; cursor: pointer; border-radius: 12px; padding: 9px 13px;
    border: 1px solid var(--line); background: var(--card); color: inherit;
    display: inline-flex; align-items: baseline; gap: 7px;
  }
  .tagchip:hover { border-color: var(--accent); }
  .tagchip .n { font-size: 11px; color: var(--muted); }
  .tagchip .bar { display: block; height: 3px; border-radius: 2px; background: var(--accent); opacity: .5; margin-top: 5px; }

  /* 设置（仪表盘） */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 21px; font-weight: 650; margin-top: 3px; }
  .group { margin-bottom: 18px; max-width: 560px; }
  .group > .gt { font-size: 11px; font-weight: 600; color: var(--muted); margin: 0 0 7px 3px; }
  .rows { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
  .row {
    appearance: none; border: 0; background: transparent; color: inherit; font: inherit; width: 100%;
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--soft); }
  .row .ri { color: var(--muted); display: flex; }
  .row .rl { flex: 1; font-size: 12.5px; }
  .row .rv { font-size: 11.5px; color: var(--muted); }
  .row.static { cursor: default; }
  .row.static:hover { background: transparent; }
  .note { font-size: 11px; line-height: 1.75; color: var(--muted); margin: 8px 3px 0; }

  /* 更多菜单 */
  .menu {
    position: absolute; z-index: 30; min-width: 186px; padding: 5px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    box-shadow: 0 16px 36px -22px rgba(0,0,0,.5);
  }
  .menu button {
    appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  .menu button:hover { background: var(--soft); }

  .toast {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); border-radius: 999px; padding: 7px 15px;
    font-size: 12px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%;
    text-align: center;
  }
  .toast.on { opacity: 1; }
  .toast.bad { background: #e11d48; color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>

  <main class="main" id="main">
    <!-- 日记（列表） -->
    <section class="bar" id="listBar">
      <h1 data-i18n="title"></h1>
      <span class="sub" id="listSub"></span>
      <div class="act">
        <input class="field search hidden" id="search" data-i18n-ph="searchPh" />
        <button class="iconbtn" id="btnSearch" data-i18n-title="search"></button>
        <button class="iconbtn primary" id="btnNew" data-i18n-title="newNote"></button>
        <button class="iconbtn" id="btnMore" data-i18n-title="more"></button>
      </div>
    </section>
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="list"></div>
    <button class="fab" id="fab">＋</button>

    <!-- 日历 -->
    <section class="scroll hidden" id="calView"></section>

    <!-- 标签 -->
    <section class="scroll hidden" id="tagView"></section>

    <!-- 设置 -->
    <section class="scroll hidden" id="setView"></section>

    <!-- 正文窗口 -->
    <div class="editor hidden" id="editor">
      <div class="ed-hd">
        <button class="iconbtn" id="edBack" data-i18n-title="back"></button>
        <span class="who" id="edWho"></span>
        <span class="grow"></span>
        <span class="count" id="edCount"></span>
        <button class="iconbtn" id="edDel" data-i18n-title="del"></button>
        <button class="iconbtn primary" id="edSave" data-i18n-title="save"></button>
      </div>
      <div class="ed-meta">
        <input class="field" type="date" id="edDay" />
        <input class="field tags" id="edTags" data-i18n-ph="tagsPh" />
        <label><input type="checkbox" id="edPin" /><span data-i18n="pin"></span></label>
      </div>
      <div class="ed-body" id="edBody">
        <div class="pane pane-input">
          <input class="ed-title" id="edTitle" data-i18n-ph="titlePh" maxlength="200" />
          <textarea class="ed-text" id="edText" spellcheck="false"></textarea>
        </div>
        <div class="pane pane-preview">
          <div class="md ed-preview" id="edPreview"></div>
        </div>
      </div>
      <span class="err hidden" id="edErr"></span>
      <div class="tools" id="tools"></div>
    </div>

    <div class="toast" id="toast"></div>
  </main>
</div>

      return (note.title + '\n' + note.body + '\n' + note.tags.join(' ')).toLowerCase().indexOf(needle) >= 0;

    list.sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (S.sort === 'day' && a.day !== b.day) return a.day < b.day ? 1 : -1;
      if (S.sort === 'title') return (a.title || '').localeCompare(b.title || '');
      return b.updatedAt - a.updatedAt;
    });
    return list;
  }
  function tagCounts() {
    var map = {};
    S.notes.forEach(function (note) {
      note.tags.forEach(function (tag) { map[tag] = (map[tag] || 0) + 1; });
    });
    return Object.keys(map)
      .sort(function (a, b) { return map[b] - map[a] || a.localeCompare(b); })
      .map(function (tag) { return { tag: tag, n: map[tag] }; });
  }

  function render() {
    renderRail();

  function renderCalendar() {
    var host = $('#calView');
    host.innerHTML = '';
    var head = el('div', 'calhd');
    var monthSel = el('select');
    for (var m = 0; m < 12; m++) {
      var opt = el('option', null, omni.lang === 'en' ? String(m + 1) : MONTHS_ZH[m]);
      opt.value = String(m);
      monthSel.appendChild(opt);
    }
    monthSel.value = String(Number(S.month.split('-')[1]) - 1);
    monthSel.addEventListener('change', function () {
      S.month = S.month.split('-')[0] + '-' + pad(Number(monthSel.value) + 1);
      renderCalendar();
    });
    var yearSel = el('select');
    var nowYear = new Date().getFullYear();
    var years = {};
    S.notes.forEach(function (note) { years[Number(note.day.slice(0, 4))] = true; });
    years[nowYear] = true;
    Object.keys(years).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) {
      var o = el('option', null, omni.lang === 'en' ? String(y) : y + ' 年');
      o.value = String(y);
      yearSel.appendChild(o);
    });
    yearSel.value = S.month.split('-')[0];
    yearSel.addEventListener('change', function () {
      S.month = yearSel.value + '-' + S.month.split('-')[1];
      renderCalendar();
    });
    head.appendChild(monthSel);
    head.appendChild(yearSel);
    var todayBtn = el('button', 'btn sm today', t('today'));
    todayBtn.type = 'button';
    todayBtn.addEventListener('click', function () {
      var d = new Date();
      S.month = d.getFullYear() + '-' + pad(d.getMonth() + 1);
      S.day = todayStr();
      showView('list');
    });
    head.appendChild(todayBtn);
    host.appendChild(head);

    var week = el('div', 'week');
    WEEK[omni.lang === 'en' ? 'en' : 'zh'].forEach(function (w) { week.appendChild(el('div', null, w)); });
    host.appendChild(week);

    var year = Number(S.month.split('-')[0]);
    var month = Number(S.month.split('-')[1]);
    var offset = (new Date(year, month - 1, 1).getDay() + 6) % 7;
    var daysInMonth = new Date(year, month, 0).getDate();
    var prevDays = new Date(year, month - 1, 0).getDate();
    var byDay = {};
    S.notes.forEach(function (note) { byDay[note.day] = (byDay[note.day] || 0) + 1; });
    var cells = Math.ceil((offset + daysInMonth) / 7) * 7;
    var todayKey = todayStr();
    var grid = el('div', 'days');

    for (var i = 0; i < cells; i++) {
      var dayNum = i - offset + 1;
      var inMonth = dayNum >= 1 && dayNum <= daysInMonth;
      var key;
      var label;
      if (inMonth) { key = year + '-' + pad(month) + '-' + pad(dayNum); label = String(dayNum); }
      else if (dayNum < 1) { key = shiftedMonth(S.month, -1) + '-' + pad(prevDays + dayNum); label = String(prevDays + dayNum); }
      else { key = shiftedMonth(S.month, 1) + '-' + pad(dayNum - daysInMonth); label = String(dayNum - daysInMonth); }
      var count = byDay[key] || 0;
      var cell = el('button', 'day' + (inMonth ? '' : ' out') + (count > 0 ? ' has' : '') +
        (key === todayKey ? ' today' : '') + (S.day === key ? ' sel' : ''));
      cell.type = 'button';
      cell.appendChild(el('span', null, label));
      var dots = el('span', 'dots');
      for (var d = 0; d < Math.min(count, 3); d++) dots.appendChild(el('span', 'dot'));
      if (count > 3) dots.appendChild(el('span', 'many', String(count)));
      cell.appendChild(dots);
      if (count > 0) cell.title = t('calCount', { n: String(count) });
      (function (dayKey) {
        cell.addEventListener('click', function () {
          S.day = dayKey;
          showView('list');
        });
      })(key);
      grid.appendChild(cell);
    }
    host.appendChild(grid);

    var monthNotes = S.notes.filter(function (note) { return note.day.slice(0, 7) === S.month; });
    var entries = el('div', 'entries');
    if (monthNotes.length === 0) entries.appendChild(el('p', 'note', t('calNone')));
    monthNotes.forEach(function (note) {
      var row = el('div', 'entry');
      var main = el('div', 'emain');
      // 参考图上的行首就是这个格式：2025年1月13日 / 星期一 - 01:38:49
      main.appendChild(el('div', 'etime', fmtDate(note.day) + ' / ' + weekdayLabel(note.day) + ' - ' + timeOf(note.updatedAt)));
      main.appendChild(el('div', 'et', note.title || t('untitled')));
      var plain = mdToPlain(note.body);
      if (plain) main.appendChild(el('div', 'ex', plain.slice(0, 150)));
      row.appendChild(main);
      if (note.images.length > 0) {
        var img = el('img');
        img.src = note.images[0].url;
        img.alt = '';
        img.loading = 'lazy';
        row.appendChild(img);
      }
      row.addEventListener('click', function () { openEditor(note); });
      entries.appendChild(row);
    });
    host.appendChild(entries);
  }

  function openEditor(note) {
    S.draft = note
      ? {
          id: note.id, day: note.day, title: note.title, body: note.body,
          tags: note.tags.slice(), images: note.images.slice(), pinned: note.pinned,
        }
      : { id: 0, day: S.day || todayStr(), title: '', body: '', tags: [], images: [], pinned: false };
    S.mode = 'edit';
    S.dirty = false;
    S.history = [S.draft.body];
    S.historyAt = 0;
    $('#edWho').textContent = note ? t('editedAt', { time: fmtStamp(note.updatedAt) }) : t('newNoteHint');
    $('#edDay').value = S.draft.day;
    $('#edTags').value = S.draft.tags.join(', ');
    $('#edPin').checked = S.draft.pinned;
    $('#edTitle').value = S.draft.title;
    $('#edText').value = S.draft.body;
    $('#edDel').classList.toggle('hidden', !note);
    $('#edErr').classList.add('hidden');
    buildTools();
    paintEditor();
    showView('editor');
    $('#edText').focus();
  }

  function syncDraft() {
    if (!S.draft) return;
    S.draft.day = $('#edDay').value || todayStr();
    S.draft.tags = parseTags($('#edTags').value);
    S.draft.pinned = $('#edPin').checked;
    S.draft.title = $('#edTitle').value;
    S.draft.body = $('#edText').value;
  }

  /**
   * 重画编辑器。**不在这里标脏** —— 打开一条笔记就走这条路径，若顺手标脏，
   * 用户点开看一眼再返回也会被问"放弃未保存的改动？"。脏标记只由真正的编辑动作（输入、
   * 工具栏、AI、改日期/标签）设置。
   */
  function paintEditor() {
    syncDraft();
    var body = $('#edBody');
    body.classList.toggle('split', S.mode === 'split');
    body.classList.toggle('preview', S.mode === 'preview');
    if (S.mode !== 'edit') {
      var html = mdToHtml(S.draft.body);
      $('#edPreview').innerHTML = html || '<p class="note">' + escapeHtml(t('bodyPh')) + '</p>';
    }
    $('#edCount').textContent = t('chars', { n: String(S.draft.body.length) }) + ' / ' + BODY_LIMIT;
  }

  function buildTools() {
    var bar = $('#tools');
    bar.innerHTML = '';
    function btn(name, titleKey, onPick, label) {
      var b = el('button', 'tbtn');
      b.type = 'button';
      if (label) b.innerHTML = label; else b.innerHTML = svg(name, 16);
      b.title = t(titleKey);
      b.setAttribute('aria-label', t(titleKey));
      b.addEventListener('click', onPick);
      bar.appendChild(b);
      return b;
    }
    btn('bold', 'tbBold', function () { wrapSel('**', '**'); });
    btn('', 'tbItalic', function () { wrapSel('*', '*'); }, '<i>I</i>');
    btn('', 'tbStrike', function () { wrapSel('~~', '~~'); }, '<s>S</s>');
    btn('', 'tbH1', function () { prefixLines('# '); }, 'H1');
    btn('', 'tbH2', function () { prefixLines('## '); }, 'H2');
    bar.appendChild(el('span', 'sep'));
    btn('ul', 'tbUl', function () { prefixLines('- '); });
    btn('ol', 'tbOl', function () { prefixLines('1. '); });
    btn('quote', 'tbQuote', function () { prefixLines('> '); });
    btn('code', 'tbCode', function () { wrapSel('`', '`'); });
    btn('code', 'tbCodeBlock', function () { insertText('\n```\n' + (omni.lang === 'en' ? 'code' : '代码') + '\n```\n'); });
    bar.appendChild(el('span', 'sep'));
    btn('link', 'tbLink', function () { wrapSel('[', '](https://)'); });
    btn('image', 'pickImage', attachImage);
    btn('hr', 'tbHr', function () { insertText('\n---\n'); });
    bar.appendChild(el('span', 'sep'));
    btn('undo', 'tbUndo', undo);
    btn('redo', 'tbRedo', redo);
    bar.appendChild(el('span', 'grow'));
    [['edit', 'modeEdit'], ['split', 'modeSplit'], ['preview', 'modePreview']].forEach(function (mode) {
      var b = el('button', 'tbtn', t(mode[1]));
      b.type = 'button';
      b.setAttribute('aria-pressed', S.mode === mode[0] ? 'true' : 'false');
      b.title = t(mode[1]);
      b.addEventListener('click', function () { S.mode = mode[0]; buildTools(); paintEditor(); });
      bar.appendChild(b);
    });
    // AI 助手（可选加成：没配对话模型就禁用，写正文不受影响）
    var ai = el('span', 'ai-ico');
    ai.innerHTML = svg('cloud', 16);
    bar.appendChild(ai);
    [['aiPolish', 'polish'], ['aiContinue', 'continue'], ['aiTitle', 'title']].forEach(function (item) {
      var b = el('button', 'tbtn', t(item[0]));
      b.type = 'button';
      b.disabled = !chatReady;
      b.title = chatReady ? t(item[0]) : t('aiNeed');
      if (!chatReady) b.style.opacity = '.45';
      b.addEventListener('click', function () { runAi(item[1]); });

    });

  // ---- 选区操作：所有工具栏按钮都走这里，保证"改完还选中、焦点不丢" ----

  function withSel(fn) {
    var ta = $('#edText');
    var start = ta.selectionStart;
    var end = ta.selectionEnd;
    var value = ta.value;
    var next = fn(value, start, end);
    pushHistory(value);
    ta.value = next.text;
    ta.focus();
    ta.selectionStart = next.start;
    ta.selectionEnd = next.end;
    S.dirty = true;
    paintEditor();
  }
  function wrapSel(before, after) {
    withSel(function (value, start, end) {
      var picked = value.slice(start, end);
      return {
        text: value.slice(0, start) + before + picked + after + value.slice(end),
        start: start + before.length,
        end: start + before.length + picked.length,
      };
    });
  }
  function prefixLines(prefix) {
    withSel(function (value, start, end) {
      var lineStart = value.lastIndexOf('\n', start - 1) + 1;
      var lineEnd = value.indexOf('\n', end);
      if (lineEnd === -1) lineEnd = value.length;
      var lines = value.slice(lineStart, lineEnd).split('\n');
      var allHave = lines.every(function (l) { return l.indexOf(prefix) === 0; });
      var next = lines.map(function (l) { return allHave ? l.slice(prefix.length) : prefix + l; }).join('\n');
      return { text: value.slice(0, lineStart) + next + value.slice(lineEnd), start: lineStart, end: lineStart + next.length };
    });
  }
  function insertText(text) {
    withSel(function (value, start, end) {
      return { text: value.slice(0, start) + text + value.slice(end), start: start + text.length, end: start + text.length };
    });
  }
  function pushHistory(value) {
    if (S.historyAt >= 0 && S.history[S.historyAt] === value) return;
    S.history = S.history.slice(0, S.historyAt + 1);
    S.history.push(value);
    if (S.history.length > 120) S.history.shift();
    S.historyAt = S.history.length - 1;
  }
  function undo() {
    if (S.historyAt <= 0) return;
    S.historyAt -= 1;
    $('#edText').value = S.history[S.historyAt];
    paintEditor();
  }
  function redo() {
    if (S.historyAt >= S.history.length - 1) return;
    S.historyAt += 1;
    $('#edText').value = S.history[S.historyAt];
    paintEditor();
  }

  // ---- 图片 ----

  function attachImage() {
    if (!S.draft) return;
    if (S.draft.images.length >= IMAGE_LIMIT) {
      toast(t('imgBudget', { n: String(IMAGE_LIMIT) }), true);
      return;
    }
    omni.files.pickAndRead({ types: 'png,jpg,jpeg,webp,gif' }).then(function (picked) {
      if (!picked || !picked.dataUrl) { toast(t('noPick'), true); return null; }
      return omni.notes.attach({ dataUrl: picked.dataUrl, name: picked.name }).then(function (res) {
        if (!res || !res.image) return null;
        S.draft.images.push(res.image);
        // 图片在正文里就是一条 markdown：用户看得见、改得了、删得掉那一行
        insertText('![' + (picked.name || 'image') + '](' + res.image.url + ')\n');
        toast(t('attached'));
        return null;
      });
    }).catch(function (e) {
      toast(e.message || String(e), true);
      omni.log('attach.failed', e.message || String(e), {});
    });
  }

  /** 保存前把正文里已经删掉的图片从附件清单里摘掉（主进程会把文件一起回收）。 */
  function liveImages() {
    if (!S.draft) return [];
    return S.draft.images.filter(function (image) {
      return S.draft.body.indexOf(image.ref) >= 0 || S.draft.body.indexOf(image.url) >= 0;
    });
  }

  function saveDraft() {
    if (!S.draft) return Promise.resolve();
    syncDraft();
    if (!S.draft.title.trim() && !S.draft.body.trim()) { fail(t('needTitle')); return Promise.resolve(); }
    if (S.draft.body.length > BODY_LIMIT) { fail(t('overLimit', { n: String(BODY_LIMIT) })); return Promise.resolve(); }
    var dropped = S.draft.images.length - liveImages().length;
    return omni.notes.save({
      id: S.draft.id || undefined,
      title: S.draft.title,
      body: S.draft.body,
      tags: S.draft.tags,
      day: S.draft.day,
      images: liveImages().map(function (image) { return image.ref; }),
      pinned: S.draft.pinned,
    }).then(function (res) {
      if (!res || !res.note) throw new Error('save failed');
      S.dirty = false;
      omni.log('saved', 'note saved', { id: res.note.id, chars: res.note.body.length, droppedImages: dropped });
      return reload().then(function () {
        toast(t('saved'));
        showView('list');
      });
    }).catch(function (e) {
      fail(e.message || String(e));
      omni.log('save.failed', e.message || String(e), {});
    });
  }

  function deleteDraft() {
    if (!S.draft || !S.draft.id) return;
    if (!window.confirm(t('confirmDel'))) return;
    omni.notes.remove(S.draft.id).then(function () {
      S.dirty = false;
      return reload().then(function () { toast(t('deleted')); showView('list'); });
    }).catch(function (e) {
      fail(e.message || String(e));
      omni.log('delete.failed', e.message || String(e), {});
    });
  }

  function fail(message) {
    var node = $('#edErr');
    node.textContent = message;
    node.classList.remove('hidden');
  }

  // ---- AI 助手 ----

  function runAi(kind) {
    if (!S.draft || !chatReady) return;
    syncDraft();
    var source = (S.draft.title ? S.draft.title + '\n\n' : '') + S.draft.body;
    if (!source.trim()) { fail(t('aiNoBody')); return; }
    var tasks = {
      polish: omni.lang === 'en'
        ? 'Polish the markdown note below: keep the meaning, tone and markdown structure. Fix grammar and wordiness. Output only the polished markdown.'
        : '把下面这段 Markdown 笔记润色一遍：保持原意、语气与 Markdown 结构，改掉病句、错别字与啰嗦表达。只输出润色后的正文。',
      continue: omni.lang === 'en'
        ? 'Below is a markdown note. Continue it in the same voice for 2-3 sentences. Output only the continuation, in markdown.'
        : '下面是一段 Markdown 笔记，请顺着同样的语气续写 2-3 句，只输出续写的部分（保持 Markdown）。',
      title: omni.lang === 'en'
        ? 'Write a title for the note below: at most 8 words. Output only the title.'
        : '给下面这段笔记起一个标题：不超过 12 个字，只输出标题本身，不要引号。',
    };
    var busy = toast(t('aiWorking'));
    var before = $('#edText').value;
    omni.text.complete({
      system: tasks[kind],
      messages: [{ role: 'user', content: source.slice(0, 20000) }],
      maxTokens: kind === 'title' ? 64 : 1024,
    }).then(function (res) {
      var text = (res && res.text ? res.text : '').trim();
      if (!text) throw new Error(t('aiNoBody'));
      pushHistory(before);
      S.dirty = true;
      if (kind === 'title') {
        $('#edTitle').value = text.replace(/^[「『"'\s]+|[」』"'\s]+$/g, '').slice(0, 200);
      } else if (kind === 'continue') {
        $('#edText').value = before.replace(/\s*$/, '') + '\n\n' + text;
      } else {
        $('#edText').value = text;
      }
      paintEditor();
      busy.hide();
      omni.log('ai.done', 'ai helper applied', { kind: kind });
    }).catch(function (e) {
      busy.hide();
      fail(e.message || String(e));
      omni.log('ai.failed', e.message || String(e), { kind: kind });
    });
  }

  // ------------------------------------------------------------------
  // 导出 / 复制
  // ------------------------------------------------------------------

  function noteMarkdown(note) {
    var lines = ['# ' + (note.title || t('untitled')), ''];
    lines.push('- ' + (omni.lang === 'en' ? 'Date' : '日期') + ': ' + note.day);
    if (note.tags.length > 0) lines.push('- ' + (omni.lang === 'en' ? 'Tags' : '标签') + ': ' + note.tags.join(', '));
    lines.push('', note.body || '', '');
    return lines.join('\n');
  }
  function saveText(name, text) {
    var bytes = new TextEncoder().encode(text);
    var binary = '';
    for (var i = 0; i < bytes.length; i += 0x8000) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return omni.files.save({ name: name, dataUrl: 'data:text/markdown;base64,' + btoa(binary) });
  }
  function exportAll() {
    if (S.notes.length === 0) return;
    var body = S.notes.map(noteMarkdown).join('\n---\n\n');
    saveText('notes-' + todayStr().replace(/-/g, '') + '.md', body).then(function (res) {
      toast(t('exported', { name: (res.path || '').split('/').pop() || '' }));
    }).catch(function (e) { toast(e.message || String(e), true); });
  }
  function copyAll() {
    if (S.notes.length === 0) return;
    navigator.clipboard.writeText(S.notes.map(noteMarkdown).join('\n---\n\n'))
      .then(function () { toast(t('copied')); })
      .catch(function () { toast(t('copied'), true); });
  }

  // ------------------------------------------------------------------
  // 菜单 / 提示
  // ------------------------------------------------------------------

  var openMenu = null;
  function closeMenu() {
    if (openMenu) { openMenu.remove(); openMenu = null; }
  }
  function showMenu(anchor) {
    closeMenu();
    var box = el('div', 'menu');
    [
      ['download', t('exportAll'), exportAll],
      ['folder', t('toBackup'), function () { omni.openSettings('backup'); }],
    ].forEach(function (item) {
      var b = el('button');
      b.type = 'button';
      var ic = el('span');
      ic.innerHTML = svg(item[0], 15);
      b.appendChild(ic);
      b.appendChild(el('span', null, item[1]));
      b.addEventListener('click', function () { closeMenu(); item[2](); });
      box.appendChild(b);
    });
    var rect = anchor.getBoundingClientRect();
    var mainRect = $('#main').getBoundingClientRect();
    box.style.top = rect.bottom - mainRect.top + 6 + 'px';
    box.style.right = Math.max(12, mainRect.right - rect.right) + 'px';
    $('#main').appendChild(box);
    openMenu = box;
  }

  var toastTimer = 0;
  function toast(message, bad) {
    var node = $('#toast');
    node.textContent = message;
    node.classList.toggle('bad', !!bad);
    node.classList.add('on');
    window.clearTimeout(toastTimer);
    var hide = function () { node.classList.remove('on'); };
    toastTimer = window.setTimeout(hide, bad ? 3600 : 2000);
    return {
      hide: function () {
        window.clearTimeout(toastTimer);
        hide();
      },
    };
  }

  // ------------------------------------------------------------------
  // 数据
  // ------------------------------------------------------------------

  function reload() {
    return omni.notes.list().then(function (res) {
      S.notes = (res && res.notes) || [];
      S.stats = (res && res.stats) || { notes: 0, images: 0, bytes: 0 };
      S.agentAccess = !res || res.agentAccess !== false;
      S.loading = false;
      render();
    }).catch(function (e) {
      S.loading = false;
      toast(e.message || String(e), true);
      omni.log('list.failed', e.message || String(e), {});
      render();
    });
  }

  function bind() {
    $('#btnNew').addEventListener('click', function () { openEditor(null); });
    $('#fab').addEventListener('click', function () { openEditor(null); });
    $('#btnSearch').addEventListener('click', function () {
      var input = $('#search');
      var show = input.classList.contains('hidden');
      input.classList.toggle('hidden', !show);
      if (show) input.focus();
      else { S.query = ''; input.value = ''; render(); }
    });
    $('#search').addEventListener('input', function () { S.query = $('#search').value; render(); });
    $('#btnMore').addEventListener('click', function (event) {
      event.stopPropagation();
      showMenu($('#btnMore'));
    });
    $('#edBack').addEventListener('click', function () { showView('list'); });
    $('#edSave').addEventListener('click', function () { saveDraft(); });
    $('#edDel').addEventListener('click', deleteDraft);
    $('#edTitle').addEventListener('input', function () {
      S.dirty = true;
      paintEditor();
    });
    $('#edText').addEventListener('input', function () {
      pushHistory($('#edText').value);
      S.dirty = true;
      paintEditor();
    });
    ['#edDay', '#edTags', '#edPin'].forEach(function (sel) {
      $(sel).addEventListener('change', function () {
        syncDraft();
        S.dirty = true;
      });
    });
    document.addEventListener('click', function () { closeMenu(); });
    window.addEventListener('keydown', function (event) {
      var mod = event.metaKey || event.ctrlKey;
      if (mod && (event.key === 's' || event.key === 'S')) {
        event.preventDefault();
        if (S.view === 'editor') saveDraft();
        return;
      }
      if (S.view === 'editor' && mod && (event.key === 'b' || event.key === 'B')) { event.preventDefault(); wrapSel('**', '**'); return; }
      if (S.view === 'editor' && mod && (event.key === 'i' || event.key === 'I')) { event.preventDefault(); wrapSel('*', '*'); return; }
      if (event.key === 'Escape') {
        if (openMenu) { closeMenu(); return; }
        if (S.view === 'editor') showView('list');
      }
    });
  }

  bind();
  omni.ready.then(function () {
    chatReady = Boolean(omni.capabilities && omni.capabilities.chat && omni.capabilities.chat.ready);
    S.month = todayStr().slice(0, 7);
    paintStatic();
    render();
    return reload();
  });
  omni.onCapabilities = function () {
    chatReady = Boolean(omni.capabilities && omni.capabilities.chat && omni.capabilities.chat.ready);
    if (S.view === 'editor') buildTools();
  };
})();
</script>
</body>
