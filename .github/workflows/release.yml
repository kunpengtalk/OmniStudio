name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.2-canary)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14 # M1/M2 Apple Silicon runner

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine build environment
        id: build-env
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [[ "$RELEASE_TAG" == *"-canary"* ]]; then
            echo "env=canary" >> $GITHUB_OUTPUT
            echo "Building canary release"
          else
            echo "env=stable" >> $GITHUB_OUTPUT
            echo "Building stable release"
          fi
          # `secrets` cannot be referenced in step `if:`, so surface signing
          # availability as an output instead.
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Apple Certificate
        if: ${{ steps.build-env.outputs.signed == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Clean up any existing keychain from previous builds
          security delete-keychain build.keychain || true

          # Create temporary keychain
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain

          # Add to search list so codesign can find it
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain

          # Import certificate with proper access
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

          # Keep keychain unlocked for the entire session
          security set-keychain-settings -lut 21600 build.keychain

          # Verify certificate is accessible
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain

          rm certificate.p12

      - name: Sign native dylibs before build
        if: ${{ steps.build-env.outputs.signed == 'true' }}
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
        run: |
          # Electrobun only signs .node files, not .dylib — pre-sign them so build.copy preserves the signature
          find -L apps/studio/node_modules/@img -name "*.dylib" | while read f; do
            echo "Signing: $f"
            codesign --sign "$ELECTROBUN_DEVELOPER_ID" --timestamp --force --options runtime "$f"
          done

      - name: Build app
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          # Unset signing secrets => build an unsigned package so CI can still
          # deliver an artifact. Once the secrets are configured this becomes 0.
          ELECTROBUN_NO_SIGN: ${{ steps.build-env.outputs.signed == 'true' && '0' || '1' }}
        run: |
          if [ "$ELECTROBUN_NO_SIGN" = "1" ]; then
            echo "::warning::No signing certificate secrets configured — producing an UNSIGNED artifact."
          fi
          if [ "${{ steps.build-env.outputs.env }}" = "canary" ]; then
            cd apps/studio && bun run build:canary
          else
            cd apps/studio && bun run build:stable
          fi

      - name: List artifacts
        run: ls -la apps/studio/artifacts/

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-darwin-arm64
          path: apps/studio/artifacts/
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine build environment
        id: build-env
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == *"-canary"* ]]; then
            echo "env=canary" >> $GITHUB_OUTPUT
            echo "Building canary release"
          else
            echo "env=stable" >> $GITHUB_OUTPUT
            echo "Building stable release"
          fi

      - name: Pre-stage electrobun CLI binary
        # Bun's isolated store places electrobun under node_modules/.bun/electrobun@x.y.z/.
        # When the launcher extracts its own CLI tarball with system tar, bsdtar on
        # Windows misparses that path (@ plus drive-letter colon) as a remote
        # user@host:path and the build fails. The launcher uses bin/electrobun.exe
        # directly when it already exists, so we extract it there up front —
        # from a clean mktemp dir so bsdtar sees a plain local path.
        shell: bash
        working-directory: apps/studio
        run: |
          set -euo pipefail
          PKG_JSON="$(bun -e 'console.log(require.resolve("electrobun/package.json"))')"
          PKG_DIR="$(dirname "$PKG_JSON")"
          VER="$(grep -m1 '"version"' "$PKG_DIR/package.json" | cut -d'"' -f4)"
          SAFEDIR="$(mktemp -d)"
          curl -sSL -o "$SAFEDIR/eb-cli.tar.gz" "https://github.com/blackboardsh/electrobun/releases/download/v$VER/electrobun-cli-win-x64.tar.gz"
          tar -xzf "$SAFEDIR/eb-cli.tar.gz" -C "$SAFEDIR"
          mkdir -p "$PKG_DIR/bin"
          cp "$SAFEDIR/electrobun.exe" "$PKG_DIR/bin/electrobun.exe"
          echo "Pre-staged electrobun CLI v$VER"

      - name: Build app
        shell: bash
        run: |
          cd apps/studio
          if [ "${{ steps.build-env.outputs.env }}" = "canary" ]; then
            bun run build:canary
          else
            bun run build:stable
          fi

      - name: List artifacts
        shell: bash
        run: ls -la apps/studio/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-win-x64
          path: apps/studio/artifacts/
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine build environment
        id: build-env
        run: |
          if [[ "$RELEASE_TAG" == *"-canary"* ]]; then
            echo "env=canary" >> $GITHUB_OUTPUT
            echo "Building canary release"
          else
            echo "env=stable" >> $GITHUB_OUTPUT
            echo "Building stable release"
          fi

      - name: Build app
        run: |
          cd apps/studio
          if [ "${{ steps.build-env.outputs.env }}" = "canary" ]; then
            bun run build:canary
          else
            bun run build:stable
          fi

      - name: List artifacts
        run: ls -la apps/studio/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnistudio-linux-x64
          path: apps/studio/artifacts/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # 必须检出仓库：下面要从 CHANGELOG.md 里取这一版的小节。此前这个 job 只有
      # download-artifact，工作区里根本没有 CHANGELOG.md —— awk 报 "cannot open file"
      # 之后被 `|| true` 吞掉，于是每次都走"没有这一版小节"的回退，而那句回退文案把
      # 原因说成了"CHANGELOG 里没写"，指向完全错误的方向。
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Determine release environment
        id: release-env
        run: |
          if [[ "$RELEASE_TAG" == *"-canary"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      # 发布说明取 CHANGELOG 里对应版本的小节。仓库把 CHANGELOG 当成唯一真源在维护
      # （中英双语、逐条写清"改了什么、为什么"），而此前 release 只挂一条自动生成的
      # compare 链接，用户点进 Release 页看不到任何内容。
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          VERSION="${RELEASE_TAG#v}"
          # 读不到文件与"没有这一版小节"是两件事，分开报：合在一起会把人引向
          # "CHANGELOG 里没写"（其实文件压根不在工作区）。两种都不阻断发布，
          # 但都留一条 warning —— 静默回退正是这个功能一直没生效却没被发现的原因。
          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::工作区里没有 CHANGELOG.md（发布说明将自动生成）"
          elif ! awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES"; then
            echo "::warning::解析 CHANGELOG.md 失败（发布说明将自动生成）"
          fi
          if [ ! -s "$NOTES" ]; then
            echo "::warning::CHANGELOG.md 里没有 ${VERSION} 小节，本版发布说明为自动生成。"
            echo "CHANGELOG.md 里没有 ${VERSION} 小节，本版发布说明为自动生成。" > "$NOTES"
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "完整变更日志见仓库 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
          } >> "$NOTES"
          echo "用 ${VERSION} 的小节作为发布说明（$(wc -l < "$NOTES") 行）"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            omnistudio-darwin-arm64/*
            omnistudio-win-x64/*
            omnistudio-linux-x64/*
          draft: false
          prerelease: ${{ steps.release-env.outputs.prerelease }}
          body_path: ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
