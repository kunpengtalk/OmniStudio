name: CI

# PR / main 分支的基础校验。此前仓库只有 tag 触发的 release.yml，
# typecheck / lint / 测试在合并前一律不跑，main 可以长期是红的。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test
    # macOS runner：应用目标平台是 macOS（llama.cpp / MLX 等引擎与路径逻辑都有
    # darwin 分支），测试也按 macOS 假设编写；Linux/Windows 的构建由 release.yml 覆盖。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # 单测里有两条（gateway-web 的产物定位与静态资源 Content-Type）要读 vite 产物
      # `apps/studio/dist`：不构建的话它们会**如实跳过**（本地没构建时同样跳过），
      # 但那样等于没验过网页端能不能真的把界面发出去，所以这里先构建一次。
      # 与独立的 `vite build` 作业是同一条命令，约 20 秒。
      - name: Build webview bundle（单测要读 vite 产物）
        run: bun x vite build
        working-directory: apps/studio

      - name: Unit tests（bunfig preload 会把数据目录指向临时目录）
        run: bun run test

      - name: Smoke（KB / 记忆 / 视频 / 迁移）
        run: bun run --cwd apps/studio test:smoke

  linux-sandbox:
    name: Linux 沙箱（Landlock 端到端）
    # 为什么单独一个 Linux 作业：Landlock 是真内核行为 —— 在 macOS 上把策略断言写满
    # 也只是"看起来对"。这个作业真的编一次辅助程序（src/bun/omni-landlock.c），
    # 真跑命令，验证"工作区外的写入被内核拒绝"。内核 ≥5.13 才有 Landlock：
    # ubuntu-24.04 runner 是 6.8+，够用。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 环境探测（内核 / 编译器 / Landlock）
        run: |
          uname -r
          cc --version | head -1

      - name: Landlock / bwrap 单测
        run: bun test apps/studio/src/bun/agent-sandbox.test.ts apps/studio/src/bun/landlock-helper.test.ts

      - name: Landlock 端到端（--require：跑不了就算失败，不许静默跳过）
        working-directory: apps/studio
        run: bun run scripts/landlock-e2e.ts --require

  build:
    name: vite build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build webview bundle
        run: bun x vite build
        working-directory: apps/studio
